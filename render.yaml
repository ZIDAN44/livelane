# Render Blueprint (Dashboard > New > Blueprint > pick this repo).
# Free web service for the API. The database is Neon's free Postgres (it never expires, unlike Render's
# free Postgres, which is deleted after 30 days): paste Neon's *direct* connection string into DATABASE_URL
# when Render asks for it. The JWT key is generated by Render, so no secret lives in this file.
services:
  - type: web
    name: livelane-api
    runtime: docker
    plan: free
    region: singapore # same AWS region as the Neon project (ap-southeast-1) to keep query latency low
    rootDir: backend # Dockerfile and build context resolve relative to rootDir
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true # random base64 256-bit key
      - key: FRONTEND_URL
        sync: false # e.g. https://tpm.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://tpm.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: KEEP_ALIVE_ENABLED
        value: "true" # self-ping every 10 min so the free instance never sleeps (no cold starts)
      - key: REMINDER_CRON
        value: "0 0 * * * *" # hourly: each run wakes Neon for ~5 min, so fewer runs save free CU-hours
      - key: DEMO_RESET_CRON
        value: "0 0 3 * * *" # wipe & re-seed the public demo nightly
      - key: MAIL_ENABLED
        value: "false" # set true + SMTP_* (e.g. Brevo / Resend SMTP) to send real e-mail
