# Render Blueprint (Dashboard > New > Blueprint > pick this repo).
# Creates a free Postgres and the backend web service; database credentials are wired in
# automatically via fromDatabase and the JWT key is generated by Render, so no secret is ever
# typed by hand. Free Render Postgres expires after 30 days - to keep data long-term, point
# DATABASE_URL at a Neon/Supabase connection string instead.
databases:
  - name: tpm-db
    plan: free
    region: singapore
    databaseName: tpm
    user: tpm

services:
  - type: web
    name: tpm-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend # Dockerfile and build context resolve relative to rootDir
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tpm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random base64 256-bit key
      - key: FRONTEND_URL
        sync: false # e.g. https://tpm.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://tpm.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_RESET_CRON
        value: "0 0 3 * * *" # wipe & re-seed the public demo nightly
      - key: MAIL_ENABLED
        value: "false" # set true + SMTP_* (e.g. Brevo / Resend SMTP) to send real e-mail
