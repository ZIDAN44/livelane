spring:
  application:
    name: tpm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tpm}
    username: ${DB_USERNAME:tpm}
    password: ${DB_PASSWORD:tpm}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      # HikariCP 6.2.1+ pings idle connections every 2 min by default, which keeps a scale-to-zero Postgres
      # (Neon) awake forever. Disabled: connections are validated on checkout instead, so the first query
      # after the database suspended just reconnects.
      keepalive-time: ${DB_KEEPALIVE_TIME:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  threads:
    virtual:
      enabled: true
  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names: memberRoles
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats
    redis:
      time-to-live: 10m
      key-prefix: "tpm:"
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # Base64 HMAC key (>= 256 bits). Override JWT_SECRET in every real deployment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    issuer: tpm
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:TPM <no-reply@tpm.local>}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-per-minute: ${RATE_LIMIT_REFILL:10}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  demo:
    # Cron for wiping & re-seeding the public demo (e.g. "0 0 3 * * *"), "-" disables it.
    reset-cron: ${DEMO_RESET_CRON:-}
  reminders:
    cron: ${REMINDER_CRON:0 */15 * * * *}
  keep-alive:
    # Self-ping for hosts that sleep when idle (Render free). Render sets RENDER_EXTERNAL_URL automatically.
    enabled: ${KEEP_ALIVE_ENABLED:false}
    url: ${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
    interval: ${KEEP_ALIVE_INTERVAL:PT10M}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error
