# Weekly dependency PRs, grouped to keep the noise down. Spring Boot's BOM governs most backend versions.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
